<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cf-auto</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="style.css">
<script>
  (function(){var t=localStorage.getItem('cf-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;})();
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img class="brand-logo" src="assets/cf-auto-logo.webp" alt="" width="34" height="34">
      <span class="brand-name">cf-auto</span>
      <span class="brand-sub" id="hdr-status">…</span>
    </div>
    <div class="topbar-actions">
      <button id="lang-toggle" class="icon-btn lang-btn" title="Language"></button>
      <button id="theme-toggle" class="icon-btn" title=""></button>
    </div>
  </div>
</header>

<nav class="seg-nav" role="tablist">
  <button class="seg-item on" data-tab="dash" data-i18n="tab.dash"></button>
  <button class="seg-item" data-tab="cfg" data-i18n="tab.cfg"></button>
  <button class="seg-item" data-tab="gist" data-i18n="tab.gist"></button>
  <button class="seg-item" data-tab="logs" data-i18n="tab.logs"></button>
</nav>

<main>
<!-- ================= 概览 ================= -->
<section id="tab-dash" class="panel active">
  <div id="run-status" class="status-banner idle">
    <span class="status-dot"></span>
    <div class="status-txt">
      <div class="st-main" id="status-main">—</div>
      <div class="st-sub" id="status-sub"></div>
    </div>
  </div>

  <div class="run-row">
    <button id="btn-run" class="btn-primary" data-i18n="dash.run"></button>
    <button id="btn-stop" class="btn-ghost danger hide" data-i18n="dash.stop"></button>
    <button id="btn-reupload" class="btn-ghost" data-i18n="dash.reupload"></button>
    <div class="run-meta" id="run-meta"></div>
  </div>

  <div class="cards">
    <div class="card"><div class="k" data-i18n="card.version"></div><div class="v" id="st-version">—</div></div>
    <div class="card"><div class="k" data-i18n="card.engine"></div><div class="v" id="st-engine">—</div></div>
    <div class="card"><div class="k" data-i18n="card.schedule"></div><div class="v" id="st-sched">—</div></div>
    <div class="card"><div class="k" data-i18n="card.gist"></div><div class="v" id="st-gist">—</div></div>
  </div>

  <h2><span data-i18n="dash.results"></span><span class="h-sub" id="result-meta"></span></h2>
  <div class="table-wrap">
    <table class="result-table" id="result-table">
      <thead><tr>
        <th data-i18n="tbl.idx"></th><th data-i18n="tbl.node"></th><th data-i18n="tbl.region"></th>
        <th data-i18n="tbl.latency"></th><th data-i18n="tbl.bandwidth"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div id="result-empty" class="empty" data-i18n="dash.empty"></div>
  </div>

  <h2><span data-i18n="dash.engine_h"></span><span class="h-sub">CloudflareSpeedTest</span></h2>
  <div class="card engine-card">
    <span><span data-i18n="eng.current"></span> <b id="eng-current">—</b></span>
    <span><span data-i18n="eng.latest"></span> <b id="eng-latest">—</b></span>
    <span class="grow"></span>
    <button class="btn-ghost" id="btn-engine-check" data-i18n="eng.check"></button>
    <button class="btn-ghost" id="btn-engine-update" data-i18n="eng.update"></button>
  </div>
  <div class="msg" id="eng-msg"></div>
</section>

<!-- ================= 优选设置 ================= -->
<section id="tab-cfg" class="panel">
  <h2 data-i18n="cfg.method_h"></h2>
  <div class="seg-ctl" id="seg-method">
    <button data-v="latency" class="on" data-i18n="method.latency"></button>
    <button data-v="bandwidth" data-i18n="method.bandwidth"></button>
  </div>
  <div class="hint" id="method-hint"></div>

  <h2 data-i18n="cfg.source_h"></h2>
  <div class="seg-ctl" id="seg-source">
    <button data-v="custom" class="on" data-i18n="source.custom"></button>
    <button data-v="official" data-i18n="source.official"></button>
    <button data-v="community" data-i18n="source.community"></button>
  </div>
  <div id="src-custom">
    <textarea id="cfg-sources" rows="6" data-i18n-ph="source.ph"></textarea>
    <div class="hint" data-i18n="source.hint"></div>
  </div>
  <div id="src-official" class="hide">
    <div class="note" data-i18n="source.official_note"></div>
  </div>
  <div id="src-community" class="hide">
    <label class="lbl"><span data-i18n="cfg.community_isp"></span></label>
    <div class="seg-ctl" id="seg-isp">
      <button data-v="auto" class="on" data-i18n="isp.auto"></button>
      <button data-v="ct" data-i18n="isp.ct"></button>
      <button data-v="cu" data-i18n="isp.cu"></button>
      <button data-v="cmcc" data-i18n="isp.cmcc"></button>
      <button data-v="cf" data-i18n="isp.cf"></button>
    </div>
    <div class="hint" data-i18n="community.hint"></div>
  </div>

  <h2 data-i18n="cfg.region_h"></h2>
  <label class="switch-row"><span data-i18n="cfg.region_en"></span><span class="switch"><input type="checkbox" id="cfg-region-en"><i></i></span></label>
  <div id="region-box" class="hide">
    <div class="chips" id="cfg-colos"></div>
    <div class="btnrow">
      <input type="text" id="cfg-colo-custom" data-i18n-ph="cfg.colo_ph" class="flex1">
      <button class="btn-ghost" id="btn-add-colo" data-i18n="cfg.add"></button>
    </div>
    <div class="hint" data-i18n="cfg.region_hint"></div>
    <div class="grid3">
      <label><span data-i18n="cfg.min_region"></span><input type="number" id="cfg-min-region" min="0" max="20"></label>
    </div>
  </div>

  <h2 data-i18n="cfg.ports_h"></h2>
  <div class="chips" id="cfg-ports"></div>
  <div class="btnrow"><input type="number" id="cfg-port-custom" data-i18n-ph="cfg.port_ph" min="1" max="65535"><button class="btn-ghost" id="btn-add-port" data-i18n="cfg.add"></button></div>

  <h2 data-i18n="cfg.policy_h"></h2>
  <div class="seg-ctl" id="seg-resultmode">
    <button data-v="overwrite" class="on" data-i18n="rmode.overwrite"></button>
    <button data-v="merge" data-i18n="rmode.merge"></button>
  </div>
  <div class="hint" id="resultmode-hint"></div>
  <div class="grid3">
    <label><span data-i18n="cfg.topn"></span><input type="number" id="cfg-topn" min="1" max="50"></label>
    <label><span data-i18n="cfg.maxlines"></span><input type="number" id="cfg-maxlines" min="5" max="100"></label>
    <label id="lbl-miss"><span data-i18n="cfg.miss"></span><input type="number" id="cfg-miss" min="1" max="20"></label>
  </div>

  <h2><span data-i18n="cfg.tag_h"></span><span class="h-sub" data-i18n="cfg.tag_sub"></span></h2>
  <input type="text" id="cfg-tag" data-i18n-ph="cfg.tag_ph">
  <div class="hint" data-i18n="cfg.tag_hint"></div>

  <h2 data-i18n="cfg.params_h"></h2>
  <div class="grid3">
    <label><span data-i18n="cfg.tl"></span><input type="number" id="cfg-cf-tl" min="0"></label>
    <label><span data-i18n="cfg.tll"></span><input type="number" id="cfg-cf-tll" min="0"></label>
    <label class="bw-only"><span data-i18n="cfg.dn"></span><input type="number" id="cfg-cf-dn" min="1" max="50"></label>
    <label class="bw-only"><span data-i18n="cfg.dt"></span><input type="number" id="cfg-cf-dt" min="1" max="30"></label>
    <label class="bw-only"><span data-i18n="cfg.sl"></span><input type="number" id="cfg-cf-sl" min="0" step="0.5"></label>
  </div>
  <label class="lbl bw-only"><span data-i18n="cfg.url"></span><input type="text" id="cfg-cf-url"></label>
  <label class="switch-row"><span data-i18n="cfg.httping"></span><span class="switch"><input type="checkbox" id="cfg-cf-httping"><i></i></span></label>
  <div class="hint" data-i18n="cfg.httping_hint"></div>
  <label class="lbl"><span data-i18n="cfg.extra"></span><input type="text" id="cfg-cf-extra" data-i18n-ph="cfg.extra_ph"></label>

  <h2 data-i18n="cfg.sched_h"></h2>
  <label class="switch-row"><span data-i18n="cfg.sched_en"></span><span class="switch"><input type="checkbox" id="cfg-sched-en"><i></i></span></label>
  <div class="grid3" id="sched-box">
    <label><span data-i18n="cfg.sched_int"></span><input type="number" id="cfg-sched-int" min="1" max="48"></label>
  </div>
  <div class="hint" data-i18n="cfg.sched_hint"></div>

  <h2 data-i18n="cfg.appupdate_h"></h2>
  <div class="card switch-row slim">
    <div class="upd-left">
      <span data-i18n="eng.autoupdate"></span>
      <small data-i18n="eng.autoupdate_hint"></small>
    </div>
    <span class="grow"></span>
    <button class="btn-ghost" id="btn-app-check" data-i18n="app.check"></button>
    <span class="switch"><input type="checkbox" id="cfg-autoupdate"><i></i></span>
  </div>
  <div class="hint" data-i18n="cfg.appupdate_hint"></div>

  <div class="btnrow big"><button class="btn-primary" id="btn-save-cfg" data-i18n="cfg.save"></button><span class="msg" id="cfg-msg"></span></div>
</section>

<!-- ================= GitHub ================= -->
<section id="tab-gist" class="panel">
  <h2 data-i18n="gist.h"></h2>
  <label class="lbl"><span data-i18n="gist.token"></span><input type="password" id="cfg-g-token" data-i18n-ph="gist.token_ph" autocomplete="off"></label>
  <div class="grid3">
    <label><span data-i18n="gist.id"></span><input type="text" id="cfg-g-id"></label>
    <label><span data-i18n="gist.file"></span><input type="text" id="cfg-g-file"></label>
    <label><span data-i18n="gist.proxy"></span><input type="text" id="cfg-g-proxy" data-i18n-ph="gist.proxy_ph"></label>
  </div>
  <div class="btnrow big">
    <button class="btn-primary" id="btn-save-gist" data-i18n="gist.save"></button>
    <button class="btn-ghost" id="btn-verify" data-i18n="gist.verify"></button>
    <span class="msg" id="gist-msg"></span>
  </div>
  <label class="switch-row"><span data-i18n="gist.autoupload"></span><span class="switch"><input type="checkbox" id="cfg-g-auto"><i></i></span></label>
  <div class="hint" data-i18n="gist.autoupload_hint"></div>

  <details class="tutorial">
    <summary data-i18n="tut.title"></summary>
    <ol>
      <li data-i18n="tut.s1"></li>
      <li data-i18n="tut.s2"></li>
      <li data-i18n="tut.s3"></li>
    </ol>
    <p data-i18n="tut.gistid"></p>
  </details>
</section>

<!-- ================= 日志 ================= -->
<section id="tab-logs" class="panel">
  <div class="btnrow log-bar">
    <label class="switch-inline"><span class="switch"><input type="checkbox" id="log-auto" checked><i></i></span><span data-i18n="logs.auto"></span></label>
    <span class="grow"></span>
    <button class="btn-ghost" id="btn-log-copy" data-i18n="logs.copy"></button>
    <button class="btn-ghost" id="btn-log-export" data-i18n="logs.export"></button>
    <button class="btn-ghost danger" id="btn-log-clear" data-i18n="logs.clear"></button>
  </div>
  <pre id="logbox" class="logbox"></pre>
</section>
</main>

<footer data-i18n="footer"></footer>

<!-- Release 通知弹窗 -->
<div id="rel-scrim" class="modal-scrim hide">
  <div class="modal-card">
    <h3 id="rel-title"></h3>
    <pre id="rel-body" class="release-body"></pre>
    <div class="btnrow big">
      <a id="rel-link" class="btn-primary" target="_blank" rel="noopener" data-i18n="rel.goto"></a>
      <button class="btn-primary" id="rel-install" data-i18n="rel.install"></button>
      <button class="btn-ghost" id="rel-skip" data-i18n="rel.skip"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
